about_title: "Για Εμένα"
about_content: "Γεία σας, ονομάζομαι Φαίδων Τσέτσης και είμαι 26 ετών (18.03.2000) μεταπτυχιακός φοιτητής στο τμήμα της Σχολής Επιστημών και Τεχνολογίας του Ελληνικού Ανοικτού Πανεπιστημίου. Μου αρέσει να συμμετέχω σε παραγωγικά έργα είτε σε ομάδες είτε ως μοναχικός λύκος. Μου αρέσουν επίσης τα εργαστήρια και τα σεμινάρια, καθώς εισάγομαι σε νέα πεδία και τεχνολογίες. Όσον αφορά την εμπειρία μου, μέχρι στιγμής αφορά κυρίως ιστοσελίδες και τομείς που βασίζονται σε δεδομένα όπως η επιστήμη δεδομένων και η μηχανική μάθηση."

version: 2

